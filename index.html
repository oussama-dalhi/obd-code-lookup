<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Look up OBD-II diagnostic trouble codes: common causes, symptoms and repair estimates."
    />
    <title>OBD-II Fault Code Lookup</title>
    <link rel="icon" href="src/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="src/css/style.css" />
    <script type="module" src="src/js/main.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="logo">
          <svg
            class="logo-icon"
            viewBox="0 0 64 32"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <!-- Body -->
            <path
              class="car-body"
              d="M4 24V18c0-1.8 1-3 2.8-3.4L15 13l6-6c.8-.7 1.6-1 2.6-1H39c1.4 0 2.4.5 3.4 1.5L49 13l8.5 1.6c2.2.4 3.5 1.8 3.5 4V24c0 .6-.4 1-1 1H5c-.6 0-1-.4-1-1z"
            />
            <!-- Windows -->
            <path class="car-window" d="M23 8.5h7.5V13H18.5z" />
            <path
              class="car-window"
              d="M33 8.5h5.8c.8 0 1.4.3 2 .8L45.5 13H33z"
            />
            <!-- Lights -->
            <rect
              x="57"
              y="16.5"
              width="3.5"
              height="2.5"
              rx="1"
              fill="#fde68a"
            />
            <rect
              x="3.5"
              y="16.5"
              width="2.5"
              height="2.5"
              rx="1"
              fill="#fecaca"
            />
            <!-- Wheels -->
            <g class="car-wheel">
              <circle cx="17" cy="24.5" r="5" />
              <circle cx="48" cy="24.5" r="5" />
            </g>
            <circle cx="17" cy="24.5" r="1.8" fill="#fff" />
            <circle cx="48" cy="24.5" r="1.8" fill="#fff" />
          </svg>
          <span>OBDAuto</span>
        </div>
      </header>

      <section class="hero">
        <h1>OBD-II Fault Code Lookup</h1>
      </section>

      <section class="search-card">
        <form id="fault-form" novalidate>
          <label for="dtc" class="label">Enter Fault Code</label>

          <div class="input-wrapper">
            <input
              type="text"
              id="dtc"
              name="dtc"
              placeholder="P0300"
              pattern="[PpBbCcUu][0-3][0-9A-Fa-f]{3}"
              title="Letter P, B, C or U followed by 4 characters, e.g. P0300"
              maxlength="5"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              required
            />

            <button type="submit" class="search-btn" id="search-button">
              Search Fault Code
            </button>
          </div>
        </form>
        <p id="message" class="message" role="alert" hidden></p>
      </section>

      <section class="results-card" aria-live="polite"></section>
    </main>
  </body>
</html>
